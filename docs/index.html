<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seance — sealed notes, opened once</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--ink:#e7e9ee;--mut:#9aa3b2;--line:#252a34;--acc:#22c55e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header,main,footer{max-width:680px;margin:0 auto;padding:20px}
  h1{margin:0;font-size:22px}
  .mut{color:var(--mut)}
  .tabs{display:flex;gap:8px;margin:14px 0}
  .tab{flex:1;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--line);cursor:pointer;background:transparent;color:var(--ink)}
  .tab.on{background:var(--card);border-color:var(--acc)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}
  label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
  textarea,input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0d1014;color:var(--ink);font-size:15px;font-family:inherit}
  textarea{min-height:110px;resize:vertical}
  button{background:var(--acc);color:#06210f;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;margin-top:10px}
  .ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .out{white-space:pre-wrap;word-break:break-all;background:#0d1014;border:1px dashed var(--line);border-radius:10px;padding:10px;margin-top:10px;font-size:13px}
  .hidden{display:none}
  .warn{color:#f59e0b}
</style>
</head>
<body>
<header>
  <h1>Seance</h1>
  <p class="mut">Seal a note with a passphrase. It opens <b>once</b>, on this device, offline.</p>
</header>
<main>
  <div class="tabs">
    <button class="tab on" id="tab-seal">Seal</button>
    <button class="tab" id="tab-open">Open</button>
  </div>

  <section id="pane-seal" class="card">
    <label for="s-text">Your note</label>
    <textarea id="s-text" placeholder="Something to say once…"></textarea>
    <label for="s-pass">Passphrase (share it separately)</label>
    <input id="s-pass" type="password" placeholder="a strong passphrase">
    <div class="row">
      <button id="seal">Seal it</button>
      <button id="s-copy" class="ghost hidden">Copy sealed text</button>
      <button id="s-clear" class="ghost">Clear</button>
    </div>
    <div id="s-out" class="out hidden"></div>
    <p class="mut" id="s-status"></p>
  </section>

  <section id="pane-open" class="card hidden">
    <label for="o-text">Sealed text</label>
    <textarea id="o-text" placeholder="paste the sealed text here"></textarea>
    <label for="o-pass">Passphrase</label>
    <input id="o-pass" type="password" placeholder="the passphrase">
    <div class="row">
      <button id="open">Open it</button>
      <button id="o-clear" class="ghost">Clear</button>
    </div>
    <div id="o-out" class="out hidden"></div>
    <p class="mut" id="o-status"></p>
    <p class="warn" id="o-once" hidden>This device has already opened a sealed note once.</p>
  </section>

  <div class="row" style="margin-top:10px">
    <button id="theme" class="ghost" type="button">Theme</button>
    <button id="lang" class="ghost" type="button">Language</button>
  </div>
</main>
<footer class="mut">Built with crypto-kit + web-kit · offline, no accounts · © 2026 Dr Sohil Momin</footer>

<script src="web-kit.js"></script>
<script src="crypto-kit.js"></script>
<script>
  Loom.theme.apply();
  Loom.seo.title("Seance — sealed notes, opened once");
  Loom.seo.description("Seal a note with a passphrase; it opens once, offline, on this device. Built with crypto-kit.");

  var $ = function (id) { return document.getElementById(id); };
  function show(id, on) { $(id).classList.toggle("hidden", !on); }

  // tabs
  $("tab-seal").onclick = function () { $("tab-seal").classList.add("on"); $("tab-open").classList.remove("on"); show("pane-seal", true); show("pane-open", false); };
  $("tab-open").onclick = function () { $("tab-open").classList.add("on"); $("tab-seal").classList.remove("on"); show("pane-open", true); show("pane-seal", false); };

  // seal
  $("seal").onclick = function () {
    var text = $("s-text").value, pass = $("s-pass").value;
    if (!text || !pass) { $("s-status").textContent = "Write a note and a passphrase."; return; }
    $("s-status").textContent = "Sealing…";
    CryptoKit.sealString(text, pass).then(function (b64) {
      $("s-out").textContent = b64; show("s-out", true); show("s-copy", true);
      $("s-status").textContent = "Sealed. Share the text and the passphrase separately.";
    }).catch(function (e) { $("s-status").textContent = "Could not seal: " + e.message; });
  };
  $("s-copy").onclick = function () {
    navigator.clipboard && navigator.clipboard.writeText($("s-out").textContent).then(function () { $("s-status").textContent = "Copied."; });
  };
  $("s-clear").onclick = function () { $("s-text").value = ""; $("s-pass").value = ""; $("s-out").textContent = ""; show("s-out", false); show("s-copy", false); $("s-status").textContent = ""; };

  // open
  var used = Loom.storage.get("opened", false);
  show("o-once", used);
  $("open").onclick = function () {
    var b64 = $("o-text").value.trim(), pass = $("o-pass").value;
    if (!b64 || !pass) { $("o-status").textContent = "Paste the sealed text and the passphrase."; return; }
    $("o-status").textContent = "Opening…";
    CryptoKit.openString(b64, pass).then(function (text) {
      $("o-out").textContent = text; show("o-out", true);
      $("o-status").textContent = "Opened.";
      Loom.storage.set("opened", true); show("o-once", true);
    }).catch(function () {
      $("o-status").textContent = "Could not open — wrong passphrase, or the text was altered.";
    });
  };
  $("o-clear").onclick = function () { $("o-text").value = ""; $("o-pass").value = ""; $("o-out").textContent = ""; show("o-out", false); $("o-status").textContent = ""; };

  // chrome
  $("theme").onclick = function () { Loom.theme.toggle(); };
  $("lang").onclick = function () { var L = Loom.i18n.langs(); Loom.i18n.setLang(L[(L.indexOf(Loom.i18n.lang) + 1) % L.length]); };
</script>
</body>
</html>
